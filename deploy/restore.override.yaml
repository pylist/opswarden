services:
  caddy:
    ports: !override
      - "${OPSWARDEN_RESTORE_HOST_PORT:?set restore loopback port}"
    volumes: !override
      - type: bind
        source: /srv/opswarden-restore/release/deploy/RestoreCaddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: /srv/opswarden-restore/caddy/data
        target: /data
      - type: bind
        source: /srv/opswarden-restore/caddy/config
        target: /config
